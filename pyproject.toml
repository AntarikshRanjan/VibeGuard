[project]
name = "vibeguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antariksh Ranjan", email = "antarikshranjan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[project.scripts]
vibeguard = "vibeguard:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
